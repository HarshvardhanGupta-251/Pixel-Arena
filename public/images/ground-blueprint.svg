<svg viewBox="0 0 700 980" xmlns="http://www.w3.org/2000/svg" style="background-color: #030303;">
  <defs>
    <!-- Turf stripe pattern -->
    <pattern id="turfPattern" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#2d6e35" />
      <rect y="24" width="48" height="24" fill="#36833f" />
      <line x1="0" y1="24" x2="48" y2="24" stroke="#40964a" stroke-width="0.7" opacity="0.6" />
      <line x1="0" y1="48" x2="48" y2="48" stroke="#255e2b" stroke-width="0.7" opacity="0.6" />
    </pattern>

    <!-- Pitch gradient -->
    <linearGradient id="cricketPitchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b89a62" />
      <stop offset="25%" stop-color="#cbab71" />
      <stop offset="50%" stop-color="#d6b87d" />
      <stop offset="75%" stop-color="#cbab71" />
      <stop offset="100%" stop-color="#b89a62" />
    </linearGradient>

    <!-- Pickleball Royal Blue Gradient -->
    <linearGradient id="courtBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f58b8" />
      <stop offset="50%" stop-color="#2564cf" />
      <stop offset="100%" stop-color="#1c4fa7" />
    </linearGradient>

    <!-- Floor tiles for office/bath -->
    <pattern id="officeTiles" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#292017" />
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#3d3023" stroke-width="0.8" />
    </pattern>

    <pattern id="toiletTiles" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#242426" />
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#333336" stroke-width="0.6" />
    </pattern>

    <pattern id="walkwayPavers" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#1e1e20" />
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#2c2c30" stroke-width="0.8" />
    </pattern>

    <!-- Floodlight beam glow -->
    <radialGradient id="lightBeamRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffd0" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#ffffcc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffcc" stop-opacity="0" />
    </radialGradient>

    <!-- Top-Down Corner Floodlight Glow Cones -->
    <linearGradient id="coneDownRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#fef08a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="coneDownLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#fef08a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Dark asphalt ground surround -->
  <rect width="700" height="980" fill="#040404" />

  <!-- Perimeter Dashed Boundary Top Line (58 ft overall) -->
  <line x1="100" y1="42" x2="610" y2="42" stroke="#52525b" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.6" />

  <!-- ========================================================= -->
  <!-- 1. CRICKET TURF (LEFT ZONE - 34 ft Wide, ~110 ft Slanted) -->
  <!-- ========================================================= -->
  <g id="cricket-turf-group">
    <!-- Turf Polygon -->
    <polygon
      points="110,60 380,60 395,780 160,935"
      fill="url(#turfPattern)"
      stroke="#3d8745"
      stroke-width="2"
      filter="url(#softShadow)"
    />

    <!-- Turf Netting Border Texture -->
    <polygon
      points="110,60 380,60 395,780 160,935"
      fill="none"
      stroke="#141416"
      stroke-width="3"
      stroke-dasharray="3 3"
      opacity="0.8"
    />

    <!-- PIXEL ARENA BRANDING (Cricket Turf) -->
    <g transform="translate(245, 260)">
      <!-- Logo Mark -->
      <rect x="-85" y="-12" width="11" height="11" fill="#00E676" />
      <text
        x="-68"
        y="0"
        fill="#FFFFFF"
        font-family="'Chakra Petch', 'Arial Black', sans-serif"
        font-weight="800"
        font-size="26"
        letter-spacing="3"
      >
        PIXEL
      </text>
      <rect x="-31" y="-6" width="6" height="6" fill="#00E676" />
      <!-- ARENA subline with green divider wings -->
      <line x1="-70" y1="13" x2="-35" y2="13" stroke="#00E676" stroke-width="2.5" />
      <text
        x="6"
        y="16"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="'Chakra Petch', 'Arial Black', sans-serif"
        font-weight="700"
        font-size="9"
        letter-spacing="5"
      >
        ARENA
      </text>
      <line x1="47" y1="13" x2="82" y2="13" stroke="#00E676" stroke-width="2.5" />
      <!-- CRICKET TURF Title -->
      <text
        x="6"
        y="38"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="'Inter', sans-serif"
        font-weight="800"
        font-size="14"
        letter-spacing="2"
      >
        CRICKET TURF
      </text>
    </g>

    <!-- CRICKET PITCH (Center) -->
    <rect
      x="220"
      y="430"
      width="50"
      height="260"
      rx="3"
      fill="url(#cricketPitchGrad)"
      stroke="#ddc186"
      stroke-width="1.2"
      filter="url(#softShadow)"
    />

    <!-- Bowling Crease Lines (White) -->
    <!-- Top Crease & Stumps -->
    <line x1="226" y1="460" x2="264" y2="460" stroke="#FFFFFF" stroke-width="2" />
    <rect x="235" y="448" width="20" height="3" fill="#ffffff" />
    <circle cx="238" cy="450" r="1.5" fill="#facc15" />
    <circle cx="245" cy="450" r="1.5" fill="#facc15" />
    <circle cx="252" cy="450" r="1.5" fill="#facc15" />

    <!-- Bottom Crease & Stumps -->
    <line x1="226" y1="660" x2="264" y2="660" stroke="#FFFFFF" stroke-width="2" />
    <rect x="235" y="667" width="20" height="3" fill="#ffffff" />
    <circle cx="238" cy="668" r="1.5" fill="#facc15" />
    <circle cx="245" cy="668" r="1.5" fill="#facc15" />
    <circle cx="252" cy="668" r="1.5" fill="#facc15" />

    <!-- Return Crease Marks -->
    <line x1="226" y1="448" x2="226" y2="472" stroke="#FFFFFF" stroke-width="1.2" />
    <line x1="264" y1="448" x2="264" y2="472" stroke="#FFFFFF" stroke-width="1.2" />
    <line x1="226" y1="648" x2="226" y2="672" stroke="#FFFFFF" stroke-width="1.2" />
    <line x1="264" y1="648" x2="264" y2="672" stroke="#FFFFFF" stroke-width="1.2" />
  </g>

  <!-- ========================================================= -->
  <!-- 2. PICKLEBALL COURT (RIGHT TOP ZONE - 24 ft x 52 ft)     -->
  <!-- ========================================================= -->
  <g id="pickleball-court-group">
    <!-- Blue Court Base -->
    <rect
      x="420"
      y="65"
      width="170"
      height="370"
      rx="4"
      fill="url(#courtBlueGrad)"
      stroke="#38bdf8"
      stroke-width="1.5"
      filter="url(#softShadow)"
    />

    <!-- White Outer Boundary Line -->
    <rect
      x="432"
      y="82"
      width="146"
      height="336"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.2"
    />

    <!-- Kitchen (Non-Volley Zone) - 7 ft each side of net -->
    <rect
      x="432"
      y="210"
      width="146"
      height="40"
      fill="#1b4792"
      stroke="#FFFFFF"
      stroke-width="1.2"
    />
    <rect
      x="432"
      y="250"
      width="146"
      height="40"
      fill="#1b4792"
      stroke="#FFFFFF"
      stroke-width="1.2"
    />

    <!-- Center Net Mesh and Stanchion Posts -->
    <line x1="416" y1="250" x2="594" y2="250" stroke="#FFFFFF" stroke-width="2.8" />
    <circle cx="416" cy="250" r="3.5" fill="#f4f4f5" stroke="#71717a" stroke-width="1" />
    <circle cx="594" cy="250" r="3.5" fill="#f4f4f5" stroke="#71717a" stroke-width="1" />

    <!-- Center Service Split Lines -->
    <line x1="505" y1="82" x2="505" y2="210" stroke="#FFFFFF" stroke-width="1.6" />
    <line x1="505" y1="290" x2="505" y2="418" stroke="#FFFFFF" stroke-width="1.6" />

    <!-- PIXEL ARENA BRANDING (Pickleball Court) -->
    <g transform="translate(505, 145)">
      <rect x="-48" y="-17" width="7" height="7" fill="#00E676" />
      <text
        x="0"
        y="-8"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="'Chakra Petch', 'Arial Black', sans-serif"
        font-weight="800"
        font-size="18"
        letter-spacing="2.5"
      >
        PIXEL
      </text>
      <!-- Sub ARENA line -->
      <line x1="-38" y1="1" x2="-15" y2="1" stroke="#00E676" stroke-width="1.8" />
      <text
        x="0"
        y="4"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="'Chakra Petch', 'Arial Black', sans-serif"
        font-weight="700"
        font-size="8"
        letter-spacing="3"
      >
        ARENA
      </text>
      <line x1="15" y1="1" x2="38" y2="1" stroke="#00E676" stroke-width="1.8" />
      <!-- PICKLEBALL COURT text -->
      <text
        x="0"
        y="24"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="'Inter', sans-serif"
        font-weight="800"
        font-size="11"
        letter-spacing="1.2"
      >
        PICKLEBALL COURT
      </text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- 3. OFFICE / CHANGING / TOILET BLOCK (Right Lower Zone)    -->
  <!-- ========================================================= -->
  <g id="office-block-group">
    <!-- Main Outer Building Enclosure -->
    <rect
      x="420"
      y="455"
      width="170"
      height="180"
      rx="4"
      fill="#1c1611"
      stroke="#443525"
      stroke-width="1.8"
      filter="url(#softShadow)"
    />

    <!-- Header Label -->
    <text
      x="505"
      y="478"
      text-anchor="middle"
      fill="#f4f4f5"
      font-family="'Chakra Petch', sans-serif"
      font-weight="700"
      font-size="10.5"
      letter-spacing="0.8"
    >
      OFFICE / CHANGING /
    </text>
    <text
      x="505"
      y="492"
      text-anchor="middle"
      fill="#f4f4f5"
      font-family="'Chakra Petch', sans-serif"
      font-weight="700"
      font-size="10.5"
      letter-spacing="0.8"
    >
      TOILET BLOCK
    </text>

    <!-- Room 1: Management Office & Reception -->
    <rect
      x="428"
      y="508"
      width="68"
      height="115"
      rx="2"
      fill="url(#officeTiles)"
      stroke="#59432d"
      stroke-width="1.2"
    />
    <!-- L-shaped Wooden Reception Desk -->
    <path
      d="M 434 532 L 460 532 L 460 554 L 452 554 L 452 540 L 434 540 Z"
      fill="#92400e"
      stroke="#b45309"
      stroke-width="0.8"
    />
    <!-- Monitor on desk -->
    <rect x="444" y="534" width="8" height="3" fill="#18181b" />
    <!-- Office Swivel Chair -->
    <circle cx="442" cy="554" r="5" fill="#27272a" stroke="#71717a" stroke-width="1" />
    <circle cx="442" cy="554" r="2" fill="#52525b" />
    <!-- Indoor Plant in corner -->
    <circle cx="434" cy="516" r="3.5" fill="#166534" />

    <!-- Room 2: Changing Room -->
    <rect
      x="502"
      y="508"
      width="40"
      height="115"
      rx="2"
      fill="url(#toiletTiles)"
      stroke="#59432d"
      stroke-width="1.2"
    />
    <!-- Bench -->
    <rect x="508" y="540" width="28" height="8" rx="1.5" fill="#78350f" />
    <!-- Washbasin -->
    <rect x="522" y="512" width="14" height="9" rx="2" fill="#e4e4e7" stroke="#71717a" stroke-width="0.8" />
    <!-- Warm overhead light spotlight -->
    <circle cx="522" cy="570" r="14" fill="#fef08a" opacity="0.15" />
    <circle cx="522" cy="570" r="2" fill="#fef08a" />

    <!-- Room 3: Restroom with Toilet Cubicle -->
    <rect
      x="546"
      y="508"
      width="38"
      height="115"
      rx="2"
      fill="url(#toiletTiles)"
      stroke="#59432d"
      stroke-width="1.2"
    />
    <!-- Ceramic toilet fixture top-down -->
    <ellipse cx="565" cy="590" rx="6" ry="8.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8" />
    <rect x="560" y="598" width="10" height="5" rx="1" fill="#cbd5e1" />
    <!-- Small sink -->
    <rect x="550" y="512" width="12" height="8" rx="2" fill="#e4e4e7" stroke="#71717a" stroke-width="0.8" />
    <circle cx="565" cy="560" r="14" fill="#fef08a" opacity="0.15" />
    <circle cx="565" cy="560" r="2" fill="#fef08a" />

    <!-- Storage / Walkway Leftover Zone (Angled) -->
    <polygon
      points="420,642 590,642 545,765 420,800"
      fill="url(#walkwayPavers)"
      stroke="#3f3f46"
      stroke-width="1.2"
      stroke-dasharray="3 3"
    />
    <text
      x="490"
      y="675"
      text-anchor="middle"
      fill="#d4d4d8"
      font-family="'Chakra Petch', sans-serif"
      font-weight="700"
      font-size="10.5"
    >
      LEFTOVER
    </text>
    <text
      x="490"
      y="690"
      text-anchor="middle"
      fill="#a1a1aa"
      font-family="'Inter', sans-serif"
      font-size="8.5"
    >
      (STORAGE / WALKWAY)
    </text>

    <!-- Storage crates / equipment rack -->
    <rect x="465" y="710" width="22" height="12" rx="1" fill="#3f3f46" stroke="#71717a" stroke-width="0.8" />
    <rect x="492" y="710" width="20" height="12" rx="1" fill="#3f3f46" stroke="#71717a" stroke-width="0.8" />
  </g>

  <!-- ========================================================= -->
  <!-- 4. FLOODLIGHT MASTS & ILLUMINATION BEAMS (NIGHT STADIUM)   -->
  <!-- ========================================================= -->
  <g id="stadium-floodlights">
    <!-- Cricket Turf Floodlights (8 Units) -->
    <!-- Top-Left -->
    <polygon points="108,62 180,180 80,240" fill="url(#coneDownRight)" />
    <!-- Top-Right -->
    <polygon points="380,62 440,200 320,240" fill="url(#coneDownLeft)" />

    <!-- Mid-Left -->
    <polygon points="106,360 220,440 106,520" fill="url(#coneDownRight)" />
    <!-- Mid-Right -->
    <polygon points="385,360 270,440 385,520" fill="url(#coneDownLeft)" />

    <!-- Bottom Slanted Lights -->
    <polygon points="160,935 240,840 120,860" fill="url(#coneDownRight)" />
    <polygon points="395,780 320,700 420,720" fill="url(#coneDownLeft)" />

    <!-- Floodlight fixture heads -->
    <g fill="#fef08a">
      <circle cx="108" cy="62" r="4.5" />
      <circle cx="380" cy="62" r="4.5" />
      <circle cx="106" cy="360" r="4.5" />
      <circle cx="385" cy="360" r="4.5" />
      <circle cx="120" cy="640" r="4.5" />
      <circle cx="390" cy="640" r="4.5" />
      <circle cx="160" cy="935" r="4.5" />
      <circle cx="395" cy="780" r="4.5" />

      <!-- Pickleball Court Lights (4 Units) -->
      <circle cx="420" cy="65" r="4" />
      <circle cx="590" cy="65" r="4" />
      <circle cx="420" cy="435" r="4" />
      <circle cx="590" cy="435" r="4" />
    </g>

    <!-- White core centers -->
    <g fill="#ffffff">
      <circle cx="108" cy="62" r="2" />
      <circle cx="380" cy="62" r="2" />
      <circle cx="106" cy="360" r="2" />
      <circle cx="385" cy="360" r="2" />
      <circle cx="120" cy="640" r="2" />
      <circle cx="390" cy="640" r="2" />
      <circle cx="160" cy="935" r="2" />
      <circle cx="395" cy="780" r="2" />
      <circle cx="420" cy="65" r="1.8" />
      <circle cx="590" cy="65" r="1.8" />
      <circle cx="420" cy="435" r="1.8" />
      <circle cx="590" cy="435" r="1.8" />
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- 5. DIMENSIONS & AREA FLOATING CARD (MATCHING USER SPEC)    -->
  <!-- ========================================================= -->
  <g transform="translate(480, 785)">
    <!-- Card Frame -->
    <rect
      x="-65"
      y="-15"
      width="270"
      height="180"
      rx="10"
      fill="#0c0c0c"
      fill-opacity="0.96"
      stroke="#27272a"
      stroke-width="1.4"
      filter="url(#softShadow)"
    />

    <!-- Header: DIMENSIONS & AREA (Neon Green) -->
    <text
      x="-48"
      y="12"
      fill="#a3e635"
      font-family="'Chakra Petch', sans-serif"
      font-weight="700"
      font-size="12"
      letter-spacing="1"
    >
      DIMENSIONS &amp; AREA
    </text>
    <line x1="-48" y1="18" x2="80" y2="18" stroke="#a3e635" stroke-width="1.4" />

    <!-- CRICKET TURF Section -->
    <text
      x="-48"
      y="38"
      fill="#f4f4f5"
      font-family="'Chakra Petch', sans-serif"
      font-weight="700"
      font-size="10.5"
    >
      CRICKET TURF
    </text>
    <text
      x="-36"
      y="54"
      fill="#d4d4d8"
      font-family="'Inter', sans-serif"
      font-size="9"
    >
      • Width (Back): 34 ft
    </text>
    <text
      x="-36"
      y="69"
      fill="#d4d4d8"
      font-family="'Inter', sans-serif"
      font-size="9"
    >
      • Length: ~110 ft (follows slant)
    </text>
    <text
      x="-36"
      y="84"
      fill="#d4d4d8"
      font-family="'Inter', sans-serif"
      font-size="9"
    >
      • Area: ~3,740 sq ft
    </text>

    <!-- PICKLEBALL COURT Section -->
    <text
      x="-48"
      y="108"
      fill="#f4f4f5"
      font-family="'Chakra Petch', sans-serif"
      font-weight="700"
      font-size="10.5"
    >
      PICKLEBALL COURT
    </text>
    <text
      x="-36"
      y="124"
      fill="#d4d4d8"
      font-family="'Inter', sans-serif"
      font-size="9"
    >
      • Size: 24 ft x 52 ft
    </text>
    <text
      x="-36"
      y="139"
      fill="#d4d4d8"
      font-family="'Inter', sans-serif"
      font-size="9"
    >
      • Area: 1,248 sq ft
    </text>

    <!-- Asterisk footnote -->
    <text
      x="-48"
      y="156"
      fill="#71717a"
      font-family="'Inter', sans-serif"
      font-style="italic"
      font-size="8"
    >
      *All dimensions are approximate.
    </text>
  </g>
</svg>
